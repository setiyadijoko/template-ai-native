name: open-code-review

# Alibaba OpenCodeReview is the semantic LLM layer (advisory, secret-gated).
# Code Review Graph supplies the complementary local structural/risk layer.
# Uses `pull_request` (NOT `pull_request_target`) per the template's security
# rule (§15.6). Forked PRs skip OCR review. Consumer adds OCR_LLM_* secrets to
# activate an approved endpoint.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "prompts/**"
      - "evals/**"
      - ".github/workflows/code-review-graph.yml"
      - ".github/workflows/open-code-review.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-code-review:
    name: OpenCodeReview (advisory)
    permissions:
      contents: read        # checkout the pull-request source for review
      pull-requests: write  # post the semantic review comments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Expose the secret to step `if:` conditions (secrets context is not
      # allowed in `if:` — only in env/with/run).
      OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OpenCodeReview
        if: ${{ env.OCR_LLM_AUTH_TOKEN != '' }}
        uses: alibaba/open-code-review@4bcc95acecd629e64ea984c962cfd08dd892a38e # v1.8.10
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ secrets.OCR_LLM_USE_ANTHROPIC }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sticky_summary: "true"
          incremental: "true"

      - name: Skip (no OCR secret)
        if: ${{ env.OCR_LLM_AUTH_TOKEN == '' }}
        run: echo "OpenCodeReview skipped — set OCR_LLM_* secrets to activate."
