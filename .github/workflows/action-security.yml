name: action-security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint (workflow syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          # Bundled shellcheck in this action checks shell snippets in run: steps.
          shellcheck: true
          fail_on_error: true
          reporter: github-check

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read           # codeql-action/upload-sarif telemetry reads workflow-run metadata
      security-events: write  # to upload SARIF on non-fork runs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zizmor (pinned via pipx)
        run: pipx install zizmor

      - name: Run zizmor
        # Produce SARIF; --pedantic is advisory. Do not hard-fail the gate on
        # advisory findings yet (Phase 1 = advisory). Promote to blocking in
        # Phase 3 once precision is measured.
        run: zizmor --pedantic --format sarif . > zizmor.sarif

      - name: Upload SARIF
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true  # advisory in Phase 1; fails harmlessly if Code Scanning isn't enabled on a fresh repo
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: zizmor.sarif
          category: zizmor
