name: artifact-attestation

# Attests the exact packaged artifact produced earlier in the same ci.yml run.
# Empty templates call this workflow with artifact-uploaded=false and skip
# explicitly without fabricating an artifact identity.
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: false
        default: ""
      artifact-uploaded:
        type: boolean
        required: true

permissions:
  contents: read
  id-token: write      # required for attestation
  attestations: write  # required to write attestations

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  attest:
    name: Attest build provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip empty template
        if: ${{ !inputs.artifact-uploaded }}
        run: echo "No build artifact exists because stack detection returned unknown."

      - name: Validate artifact identity
        if: ${{ inputs.artifact-uploaded }}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          if [[ ! "$ARTIFACT_NAME" =~ ^build-(python|node|go|java|dotnet)$ ]]; then
            echo "::error::Invalid build artifact name: $ARTIFACT_NAME"
            exit 1
          fi

      - name: Download build artifact
        if: ${{ inputs.artifact-uploaded }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact

      - id: subject
        name: Resolve attestation subject
        if: ${{ inputs.artifact-uploaded }}
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          subject="$GITHUB_WORKSPACE/artifact/template-ai-native-${ARTIFACT_NAME}.tar.gz"
          count="$(find artifact -type f | wc -l | tr -d ' ')"

          if [[ "$count" -ne 1 ]] || [[ ! -f "$subject" ]]; then
            echo "::error::Expected exactly one packaged file named $(basename "$subject")"
            exit 1
          fi

          echo "path=$subject" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: ${{ inputs.artifact-uploaded }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subject.outputs.path }}
