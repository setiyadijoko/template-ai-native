name: ai-evaluation

# Reusable advisory mode always runs the deterministic `--check` contract
# without a credential or provider call. Direct event mode remains secret-gated;
# the template makes no real model calls until a consumer extends the runner.
on:
  workflow_call:
    inputs:
      execution_channel:
        type: string
        required: true
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "src/**"
      - ".github/workflows/ai-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ai-evaluation-${{ inputs.execution_channel || 'baseline-direct' }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deterministic-ai-evaluation:
    name: Deterministic AI evaluation
    if: ${{ inputs.execution_channel != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate execution channel
        env:
          EXECUTION_CHANNEL: ${{ inputs.execution_channel }}
        run: |
          case "$EXECUTION_CHANNEL" in
            profile-advisory) ;;
            *) printf 'Unsupported execution channel: %s\n' "$EXECUTION_CHANNEL" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run deterministic evaluation contract
        run: sh evals/run-evals.sh --check

  ai-evaluation:
    name: AI evaluation (advisory skeleton)
    if: ${{ inputs.execution_channel == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Expose the secret to step `if:` conditions (secrets context is not
      # allowed in `if:` — only in env/with/run).
      AI_EVAL_API_KEY: ${{ secrets.AI_EVAL_API_KEY }}
    steps:
      - name: Validate execution channel
        env:
          EXECUTION_CHANNEL: ${{ inputs.execution_channel || 'baseline-direct' }}
        run: |
          case "$EXECUTION_CHANNEL" in
            baseline-direct) ;;
            *) printf 'Unsupported execution channel: %s\n' "$EXECUTION_CHANNEL" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip direct evaluation (no AI_EVAL_API_KEY)
        if: ${{ env.AI_EVAL_API_KEY == '' }}
        run: echo "Direct AI evaluation skipped — set AI_EVAL_API_KEY only after approving the consumer adapter and data policy."

      - name: Run direct evaluation contract (secret-gated)
        if: ${{ env.AI_EVAL_API_KEY != '' }}
        run: |
          sh evals/run-evals.sh --check
          # Consumer: replace the provider-neutral stub with an adapter-backed
          # runner that uses AI_EVAL_API_KEY under an approved data policy.
