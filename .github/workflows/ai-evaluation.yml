name: ai-evaluation

# AI evaluation skeleton (advisory). Skips cleanly when AI_EVAL_API_KEY is
# absent — the template makes no real model calls. Consumer adds the secret
# and an evals/run-evals.sh runner to activate.
on:
  workflow_call:
    inputs:
      execution_channel:
        type: string
        required: true
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "src/**"
      - ".github/workflows/ai-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ai-evaluation-${{ inputs.execution_channel || 'baseline-direct' }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deterministic-ai-evaluation:
    name: Deterministic AI evaluation
    if: ${{ inputs.execution_channel != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate execution channel
        run: |
          channel="${{ inputs.execution_channel }}"
          case "$channel" in
            profile-advisory) ;;
            *) echo "Unsupported execution channel: $channel" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic evaluation contract
        run: sh evals/run-evals.sh --check

  ai-evaluation:
    name: AI evaluation (advisory skeleton)
    if: ${{ inputs.execution_channel == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Expose the secret to step `if:` conditions (secrets context is not
      # allowed in `if:` — only in env/with/run).
      AI_EVAL_API_KEY: ${{ secrets.AI_EVAL_API_KEY }}
    steps:
      - name: Validate execution channel
        run: |
          channel="${{ inputs.execution_channel || 'baseline-direct' }}"
          case "$channel" in
            baseline-direct) ;;
            *) echo "Unsupported execution channel: $channel" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip (no AI_EVAL_API_KEY)
        if: ${{ env.AI_EVAL_API_KEY == '' }}
        run: echo "AI-eval skipped — set the AI_EVAL_API_KEY secret and add evals/run-evals.sh to activate."

      - name: Run evaluation contract (provider-neutral stub)
        if: ${{ env.AI_EVAL_API_KEY != '' }}
        run: |
          sh evals/run-evals.sh --check
          # Consumer: replace the provider-neutral stub with an adapter-backed
          # runner that uses AI_EVAL_API_KEY under an approved data policy.
