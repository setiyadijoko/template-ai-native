name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commit types from CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            security
            revert
          requireScope: false
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: 'The subject must be lowercase and must not start with an uppercase letter.'
