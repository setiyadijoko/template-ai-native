name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write  # amannn/action-semantic-pull-request posts a status check
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commit types from CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            security
            revert
          requireScope: false
          # Allow normal sentence casing in the subject; reject only an
          # all-caps subject (which signals a non-Conventional title).
          subjectPattern: '^(?![A-Z]{2,}).+$'
          subjectPatternError: 'The subject should not be in all-uppercase.'
