name: docs-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Markdown lint + link check + TBD/TODO scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@db43aef879112c3119a410d69f66701e0d530809 # v17.0.0
        with:
          # Negation globs must be passed here (action globs take precedence
          # over config "ignores"). Excludes auto-generated/internal docs.
          globs: |
            **/*.md
            !CHANGELOG.md
            !LICENSE
            !.github/pull_request_template.md
            !.github/ISSUE_TEMPLATE/**
            !docs/superpowers/**

      - name: Link check
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6 # v2.3.0
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --exclude "^https://github.com/.*/(security|settings)/.*$"
            README.md docs
          fail: true

      - name: Scan for TBD/TODO/FIXME in docs (allowed only in plans/internal docs)
        shell: python
        run: |
          import glob, re, sys
          pattern = re.compile(r"\b(TBD|TODO|FIXME)\b")
          offenders = []
          for f in glob.glob("docs/**/*.md", recursive=True):
              # plans and internal working specs may legitimately carry TODOs
              if f.startswith("docs/plans/") or f.startswith("docs/superpowers/"):
                  continue
              for i, line in enumerate(open(f, encoding="utf-8"), 1):
                  if pattern.search(line):
                      offenders.append(f"{f}:{i}: {line.strip()}")
          if offenders:
              print("Unresolved markers found outside docs/plans/:")
              for o in offenders:
                  print(" -", o)
              sys.exit(1)
          print("No unresolved TBD/TODO/FIXME markers outside docs/plans/.")

# Workflow registered.
