name: dependency-review

# Uses osv-scanner CLI directly (GHAS-free) instead of the GitHub
# dependency-review-action (which requires GHAS + Dependency graph) and
# instead of the osv-scanner reusable workflow (which was unreliable to
# invoke). Scans lockfiles/manifests against the OSV database; blocks when
# a vulnerability is found.
on:
  workflow_call:
    inputs:
      execution_channel:
        type: string
        required: true
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-dependency-review-${{ inputs.execution_channel || 'baseline-direct' }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  direct_mode:
    name: Resolve direct execution mode
    if: ${{ inputs.execution_channel == '' }}
    uses: ./.github/workflows/direct-execution-mode.yml
    with:
      source_event: ${{ github.event_name }}

  osv-scan:
    name: osv-scanner (block on vulnerable dependency)
    needs: direct_mode
    if: >-
      always() &&
      (inputs.execution_channel != '' ||
      (needs.direct_mode.result == 'success' &&
      needs.direct_mode.outputs.direct_profile_controls == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate execution channel
        env:
          EXECUTION_CHANNEL: ${{ inputs.execution_channel || 'baseline-direct' }}
        run: |
          case "$EXECUTION_CHANNEL" in
            baseline-direct|profile-advisory) ;;
            *) printf 'Unsupported execution channel: %s\n' "$EXECUTION_CHANNEL" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner CLI
        run: |
          set -euo pipefail
          version="v2.4.0"
          asset="osv-scanner_linux_amd64"
          expected_sha256="15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
          download="$RUNNER_TEMP/$asset"
          url="https://github.com/google/osv-scanner/releases/download/${version}/${asset}"
          curl --fail --silent --show-error --location --retry 3 "$url" \
            --output "$download"
          printf '%s  %s\n' "$expected_sha256" "$download" | sha256sum -c -
          install -m 0755 "$download" "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Scan dependencies (recursive)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/osv-scanner" scan source --recursive \
            --allow-no-lockfiles --format=table .
