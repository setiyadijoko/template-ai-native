name: secret-scan

# Uses the gitleaks CLI directly (downloaded from the release) instead of
# gitleaks-action, so it works on private repos WITHOUT GitHub Advanced Security.
on:
  workflow_call:
    inputs:
      execution_channel:
        type: string
        required: true
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 3"   # weekly, Wed 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-secret-scan-${{ inputs.execution_channel || 'baseline-direct' }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  direct_mode:
    name: Resolve direct execution mode
    if: ${{ inputs.execution_channel == '' }}
    uses: ./.github/workflows/direct-execution-mode.yml
    with:
      source_event: ${{ github.event_name }}

  secret-scan:
    name: gitleaks (block on any secret)
    needs: direct_mode
    if: >-
      always() &&
      (inputs.execution_channel != '' ||
      (needs.direct_mode.result == 'success' &&
      needs.direct_mode.outputs.direct_profile_controls == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate execution channel
        env:
          EXECUTION_CHANNEL: ${{ inputs.execution_channel || 'baseline-direct' }}
        run: |
          case "$EXECUTION_CHANNEL" in
            baseline-direct|profile-advisory) ;;
            *) printf 'Unsupported execution channel: %s\n' "$EXECUTION_CHANNEL" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history for scheduled history scans

      - name: Install gitleaks CLI
        run: |
          version="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        # PR runs scan the current state; scheduled runs scan full history.
        # Blocks on any finding. Gitleaks masks secret values by default.
        run: gitleaks detect --source . --no-banner --redact
