name: secret-scan

# Uses the gitleaks CLI directly (downloaded from the release) instead of
# gitleaks-action, so it works on private repos WITHOUT GitHub Advanced Security.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 3"   # weekly, Wed 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks (block on any secret)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for scheduled history scans

      - name: Install gitleaks CLI
        run: |
          version="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        # PR runs scan the current state; scheduled runs scan full history.
        # Blocks on any finding. Gitleaks masks secret values by default.
        run: gitleaks detect --source . --no-banner --redact
