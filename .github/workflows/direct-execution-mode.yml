name: direct-execution-mode

on:
  workflow_call:
    inputs:
      source_event:
        description: Event name observed by the calling workflow
        type: string
        required: true
    outputs:
      direct_profile_controls:
        description: Whether duplicated direct profile controls should execute
        value: ${{ jobs.resolve.outputs.direct_profile_controls }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve direct execution mode
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      direct_profile_controls: ${{ steps.mode.outputs.direct_profile_controls }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: mode
        name: Resolve repository mode
        env:
          SOURCE_EVENT: ${{ inputs.source_event }}
        run: |
          mode="$(sh scripts/resolve-direct-execution-mode.sh)"
          case "$mode" in
            direct_profile_controls=true) value=true ;;
            direct_profile_controls=false) value=false ;;
            *) printf 'Invalid direct execution mode: %s\n' "$mode" >&2; exit 1 ;;
          esac
          echo "direct_profile_controls=$value" >> "$GITHUB_OUTPUT"
