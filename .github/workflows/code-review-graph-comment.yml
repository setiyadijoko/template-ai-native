name: Code Review Graph Comment

# Trusted publication half. GitHub loads workflow_run workflows from the
# default branch; this job never checks out or executes pull-request code.
on: # zizmor: ignore[dangerous-triggers] -- required for fork-safe trusted publication
  workflow_run:
    workflows: [Code Review Graph]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    name: Publish validated report
    permissions:
      actions: read          # download the report from the completed analysis run
      pull-requests: write  # update the single sticky PR comment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate one bounded report artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ARCHIVE_BYTES: "100000"
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mapfile -t artifact_rows < <(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            -f per_page=100 \
            --jq '.artifacts[] | select(.name == "crg-report" and (.expired | not)) | [.id, .size_in_bytes] | @tsv')
          if [ "${#artifact_rows[@]}" -ne 1 ]; then
            echo "Expected exactly one non-expired crg-report artifact." >&2
            exit 1
          fi
          IFS=$'\t' read -r artifact_id artifact_size <<< "${artifact_rows[0]}"
          case "${artifact_id}" in ''|*[!0-9]*) exit 1 ;; esac
          case "${artifact_size}" in ''|*[!0-9]*) exit 1 ;; esac
          if [ "${artifact_size}" -eq 0 ] || [ "${artifact_size}" -gt "${MAX_ARCHIVE_BYTES}" ]; then
            echo "Artifact archive is empty or exceeds the size cap." >&2
            exit 1
          fi
          printf 'artifact-id=%s\n' "${artifact_id}" >> "${GITHUB_OUTPUT}"

      - name: Download report artifact into runner temp
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/crg-report-download
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and wrap untrusted report
        env:
          COMMENT_BODY: ${{ runner.temp }}/crg-comment-body.md
          DOWNLOAD_DIR: ${{ runner.temp }}/crg-report-download
          VALIDATED_PR_NUMBER: ${{ runner.temp }}/crg-pr-number.txt
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["DOWNLOAD_DIR"])
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("Artifact extraction root is not a safe directory")
          entries = {path.name: path for path in root.iterdir()}
          if set(entries) != {"crg-comment.md", "pr-number.txt"}:
              raise SystemExit("Artifact must contain exactly the expected files")
          if any(path.is_symlink() or not path.is_file() for path in entries.values()):
              raise SystemExit("Artifact entries must be regular files")

          pr_text = entries["pr-number.txt"].read_bytes().decode("ascii")
          if re.fullmatch(r"[1-9][0-9]{0,9}\n?", pr_text) is None:
              raise SystemExit("PR number must contain only a positive integer")
          report_file = entries["crg-comment.md"]
          if report_file.stat().st_size == 0 or report_file.stat().st_size > 60000:
              raise SystemExit("Report artifact is empty or too large")
          text = report_file.read_bytes().decode("utf-8")
          if any(ord(char) < 32 and char not in "\n\r\t" for char in text) or "\x7f" in text:
              raise SystemExit("Report contains disallowed control characters")
          marker = "<!-- code-review-graph-report -->"
          text = text.replace(marker, "").replace("\r\n", "\n").replace("\r", "\n").lstrip("\n")
          if not text.startswith("## code-review-graph review\n") or "*Powered by [code-review-graph]" not in text:
              raise SystemExit("Report has an unexpected format")
          text = text.replace("@", "&#64;")
          body = f"{marker}\n\n{text}".encode("utf-8")
          if len(body) > 65000:
              raise SystemExit("Wrapped comment exceeds the GitHub body limit")
          Path(os.environ["COMMENT_BODY"]).write_bytes(body)
          Path(os.environ["VALIDATED_PR_NUMBER"]).write_text(str(int(pr_text)), encoding="ascii")
          PY

      - name: Upsert sticky PR comment
        env:
          COMMENT_BODY: ${{ runner.temp }}/crg-comment-body.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER_FILE: ${{ runner.temp }}/crg-pr-number.txt
        run: |
          set -euo pipefail
          pr_number=$(cat "${PR_NUMBER_FILE}")
          actual_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
          if [ "${actual_sha}" != "${HEAD_SHA}" ]; then
            echo "PR head does not match the analyzed commit; refusing to comment." >&2
            exit 1
          fi
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- code-review-graph-report -->"))) | .id' | sed -n '1p')
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH --silent "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@"${COMMENT_BODY}"
          else
            gh api --method POST --silent "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" -F body=@"${COMMENT_BODY}"
          fi
