name: codeql

# CodeQL SAST for the public template repository. Scanner execution and result
# storage fail closed; findings are surfaced through GitHub Code Scanning.
on:
  workflow_call:
    inputs:
      execution_channel:
        type: string
        required: true
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 3"   # weekly, Wed 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-codeql-${{ inputs.execution_channel || 'baseline-direct' }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  direct_mode:
    name: Resolve direct execution mode
    if: ${{ inputs.execution_channel == '' }}
    uses: ./.github/workflows/direct-execution-mode.yml
    with:
      source_event: ${{ github.event_name }}

  codeql:
    name: CodeQL (blocking)
    needs: direct_mode
    if: >-
      always() &&
      (inputs.execution_channel != '' ||
      (needs.direct_mode.result == 'success' &&
      needs.direct_mode.outputs.direct_profile_controls == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # checkout repository source and workflows
      security-events: write  # upload CodeQL analysis to Code Scanning
    steps:
      - name: Validate execution channel
        env:
          EXECUTION_CHANNEL: ${{ inputs.execution_channel || 'baseline-direct' }}
        run: |
          case "$EXECUTION_CHANNEL" in
            baseline-direct|profile-advisory) ;;
            *) printf 'Unsupported execution channel: %s\n' "$EXECUTION_CHANNEL" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Omitting languages lets CodeQL detect every supported language present.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
