name: scorecard

# OpenSSF Scorecard is designed for public repositories; results are limited
# on private repos. Runs as advisory; SARIF upload is continue-on-error.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"   # weekly, Wed 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Scorecard
        continue-on-error: true   # advisory; scorecard is designed for public repos and may fail on private
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_format: sarif
          results_file: scorecard.sarif
          publish_results: true
      - name: Upload SARIF
        continue-on-error: true   # private repo without GHAS: upload fails gracefully
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: scorecard.sarif
          category: scorecard
