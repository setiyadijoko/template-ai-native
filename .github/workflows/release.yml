name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the draft release
      actions: read    # resolve the exact CI run and download its artifact
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - id: stack
        name: Detect stack for tagged tree
        run: |
          stack="$(sh scripts/detect-stack.sh)"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "Detected stack: $stack"

      - id: evidence
        name: Resolve exact-SHA CI evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STACK: ${{ steps.stack.outputs.stack }}
        run: |
          set -euo pipefail
          stack="$STACK"
          runs_endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=completed&per_page=100"
          runs_json="$(gh api "$runs_endpoint")"
          run_id="$(
            jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.event == "push")
                | select(.status == "completed")
                | select(.conclusion == "success")]
              | sort_by(.run_number)
              | last
              | .id // empty
            ' <<< "$runs_json"
          )"

          if [[ -z "$run_id" ]]; then
            echo "::error::No successful ci.yml push run found for exact SHA $GITHUB_SHA"
            exit 1
          fi

          artifacts_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100"
          )"
          total_count="$(jq -r '.total_count' <<< "$artifacts_json")"
          if [[ "$total_count" -gt 100 ]]; then
            echo "::error::CI run has more artifacts than can be validated safely"
            exit 1
          fi

          build_count="$(
            jq -r '[.artifacts[] | select(.name | startswith("build-"))] | length' \
              <<< "$artifacts_json"
          )"
          expected_artifact="build-$stack"

          case "$stack" in
            unknown)
              if [[ "$build_count" -ne 0 ]]; then
                echo "::error::Unknown stack CI run must not contain a build artifact"
                exit 1
              fi
              echo "artifact-name=" >> "$GITHUB_OUTPUT"
              echo "artifact-present=false" >> "$GITHUB_OUTPUT"
              ;;
            python|node|go|java|dotnet)
              if [[ "$build_count" -ne 1 ]]; then
                echo "::error::Expected exactly one build artifact; found $build_count"
                exit 1
              fi

              artifact_name="$(
                jq -r '.artifacts[] | select(.name | startswith("build-")) | .name' \
                  <<< "$artifacts_json"
              )"
              artifact_expired="$(
                jq -r '.artifacts[] | select(.name | startswith("build-")) | .expired' \
                  <<< "$artifacts_json"
              )"

              if [[ "$artifact_name" != "$expected_artifact" ]]; then
                echo "::error::Expected $expected_artifact; found $artifact_name"
                exit 1
              fi
              if [[ "$artifact_expired" != "false" ]]; then
                echo "::error::Build artifact $artifact_name is expired"
                exit 1
              fi

              echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
              echo "artifact-present=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported detected stack: $stack"
              exit 1
              ;;
          esac

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact CI artifact
        if: steps.evidence.outputs.artifact-present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact-name }}
          path: downloaded-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run-id }}

      - id: asset
        name: Prepare release artifact without rebuild
        shell: bash
        env:
          ARTIFACT_PRESENT: ${{ steps.evidence.outputs.artifact-present }}
          STACK: ${{ steps.stack.outputs.stack }}
        run: |
          set -euo pipefail
          asset="template-ai-native-${GITHUB_REF_NAME}.tar.gz"

          case "$STACK" in
            unknown)
              if [[ "$ARTIFACT_PRESENT" != "false" ]]; then
                echo "::error::Source fallback is only valid without a build artifact"
                exit 1
              fi
              git archive \
                --format=tar.gz \
                --prefix="template-ai-native-${GITHUB_REF_NAME}/" \
                --output="$asset" \
                "$GITHUB_SHA"
              ;;
            python|node|go|java|dotnet)
              if [[ "$ARTIFACT_PRESENT" != "true" ]]; then
                echo "::error::Known stack requires the verified CI artifact"
                exit 1
              fi

              source="downloaded-artifact/template-ai-native-build-${STACK}.tar.gz"
              count="$(find downloaded-artifact -type f | wc -l | tr -d ' ')"
              if [[ "$count" -ne 1 ]] || [[ ! -f "$source" ]]; then
                echo "::error::Downloaded artifact does not contain the expected package"
                exit 1
              fi
              mv "$source" "$asset"
              ;;
            *)
              echo "::error::Unsupported detected stack: $STACK"
              exit 1
              ;;
          esac

          echo "path=$asset" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false   # attached to the release instead

      - name: Compute digest manifest
        env:
          RELEASE_ASSET: ${{ steps.asset.outputs.path }}
        run: |
          sha256sum "$RELEASE_ASSET" sbom.spdx.json > digests.txt
          echo "Release artifact and SBOM digests computed."

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true   # uses commit/PR history + .github/release.yml categories
          files: |
            ${{ steps.asset.outputs.path }}
            sbom.spdx.json
            digests.txt
