name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      stack: ${{ steps.d.outputs.stack }}
      layout: ${{ steps.d.outputs.layout }}
      component_ready: ${{ steps.d.outputs.component_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        name: Detect stack
        run: |
          layout="$(sh scripts/resolve-components.sh --layout)"
          echo "layout=$layout" >> "$GITHUB_OUTPUT"
          component_ready=false
          if [ "$layout" = 'monorepo' ]; then
            version="$(awk -F ':[[:space:]]*' '$1 == "version" { print $2; exit }' .template/project.yaml)"
            if [ "$version" = '2' ]; then
              sh scripts/validate-project-config.sh
              component_ready=true
            fi
          fi
          echo "component_ready=$component_ready" >> "$GITHUB_OUTPUT"
          stack="$(sh scripts/detect-stack.sh)"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "Detected layout: $layout"
          echo "Detected stack: $stack"

  quality:
    name: Quality (format/lint/typecheck/unit)
    needs: detect
    if: needs.detect.outputs.stack != 'unknown'
    uses: ./.github/workflows/ci-quality.yml
    with:
      stack: ${{ needs.detect.outputs.stack }}

  test:
    name: Tests + coverage
    needs: detect
    if: needs.detect.outputs.stack != 'unknown'
    uses: ./.github/workflows/ci-test.yml
    with:
      stack: ${{ needs.detect.outputs.stack }}

  build:
    name: Build
    needs: detect
    if: needs.detect.outputs.stack != 'unknown'
    uses: ./.github/workflows/build.yml
    with:
      stack: ${{ needs.detect.outputs.stack }}

  monorepo:
    name: Component-aware monorepo CI
    needs: detect
    if: needs.detect.outputs.component_ready == 'true'
    uses: ./.github/workflows/ci-monorepo.yml

  attest:
    name: Attest build provenance
    needs: [detect, build, monorepo]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.result == 'success' &&
      needs.monorepo.result == 'skipped' &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' &&
      needs.detect.outputs.stack == 'unknown'))
    permissions:
      contents: read       # resolve repository metadata for provenance
      id-token: write      # request the OIDC identity used to sign provenance
      attestations: write  # persist the build-provenance attestation
    uses: ./.github/workflows/artifact-attestation.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name || '' }}
      artifact-uploaded: ${{ needs.build.outputs.artifact-uploaded == 'true' }}
