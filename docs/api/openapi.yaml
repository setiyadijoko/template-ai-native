# Minimal OpenAPI 3.0 skeleton. Expand with your API.
openapi: 3.0.3
info:
  title: template-ai-native API
  version: 0.1.0
  description: |
    Skeleton OpenAPI document for a project created from the template-ai-native
    template. Replace with your API definition.
  license:
    name: MIT
servers:
  - url: https://api.example.com/v1
    description: Production
# Future operations require bearer authentication unless they explicitly opt
# out. The health probe below is intentionally unauthenticated for monitoring.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Service health probe (example)
      description: |
        Illustrative contract only. A consumer must implement this endpoint,
        choose its dependency checks, and align the response with its runtime.
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service is unavailable or a required dependency is unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Optional build or release identifier; do not expose secrets.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid
            details:
              type: object
              additionalProperties: true
