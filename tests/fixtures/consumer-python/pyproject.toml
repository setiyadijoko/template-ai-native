[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template-python-consumer-fixture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "ruff==0.15.22",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "build==1.5.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
